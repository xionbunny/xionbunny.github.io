<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        /* ---------- Design tokens ----------
           One palette, one accent, one type scale. Everything below reads from these. */
        :root {
            --bg: #070b12;
            --panel: rgba(13, 19, 28, 0.72);
            --surface: rgba(255, 255, 255, 0.032);
            --surface-hover: rgba(255, 255, 255, 0.055);
            --line: rgba(226, 234, 245, 0.10);
            --line-strong: rgba(226, 234, 245, 0.17);
            --text: #e7edf5;
            --text-dim: rgba(226, 234, 245, 0.66);
            --text-faint: rgba(226, 234, 245, 0.42);
            --accent: #6aa9d8;          /* the only UI accent */
            --radius: 14px;
            --radius-sm: 10px;
            --space: 8px;               /* base unit for the spacing scale */
            --line-height: 1.5;         /* body copy */
            --line-height-tight: 1.25;  /* headings */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: var(--line-height);
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(var(--space) * 4) calc(var(--space) * 2);
            position: relative;
            overflow-x: hidden;
        }

        ::selection {
            background: rgba(106, 169, 216, 0.24);
            color: #fff;
        }

        /* Firefox needs the same treatment as WebKit; without this the two engines
           render the page differently for no reason. */
        html {
            scrollbar-width: thin;
            scrollbar-color: rgba(226, 234, 245, 0.14) transparent;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(226, 234, 245, 0.14); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(226, 234, 245, 0.22); }

        /* ---------- Background layers ----------
           The sky is ambient: one quiet horizon wash, no blobs, no competing focal points. */
        .starfield {
            position: fixed;
            inset: 0;
            z-index: -4;
            background:
                radial-gradient(120% 55% at 50% 100%, rgba(96, 132, 178, 0.07), transparent 70%),
                radial-gradient(90% 60% at 50% 8%, rgba(110, 148, 195, 0.045), transparent 65%),
                linear-gradient(180deg, #0a1119 0%, #070b12 55%, #05080d 100%);
            pointer-events: none;
        }

        .stars {
            position: fixed;
            inset: -6%;
            z-index: -2;
            pointer-events: none;
            animation: starfield-drift 200s linear infinite alternate;
            will-change: transform;
            /* Fade the field toward the horizon: dense at the zenith, thin at the bottom. */
            -webkit-mask-image: radial-gradient(120% 110% at 50% 42%, #000 38%, rgba(0, 0, 0, 0.6) 72%, rgba(0, 0, 0, 0.15) 100%);
            mask-image: radial-gradient(120% 110% at 50% 42%, #000 38%, rgba(0, 0, 0, 0.6) 72%, rgba(0, 0, 0, 0.15) 100%);
        }
        /* Static density layer (no DOM cost, works with JS disabled). Kept quiet: the
           sky is texture behind the card, not the subject of the page. */
        .stars::before {
            content: "";
            position: absolute;
            inset: 0;
            /* One star per gradient, each on its own coprime tile. Sharing tile
               sizes made the dots line up into a visible lattice, which read as
               graph paper rather than sky. */
            background-image:
                radial-gradient(1px 1px at 25px 35px, rgba(255, 255, 255, 0.34), transparent 50%),
                radial-gradient(1px 1px at 120px 90px, rgba(205, 222, 255, 0.28), transparent 50%),
                radial-gradient(1.5px 1.5px at 200px 150px, rgba(255, 255, 255, 0.36), transparent 50%),
                radial-gradient(1px 1px at 300px 60px, rgba(190, 215, 255, 0.24), transparent 50%),
                radial-gradient(1px 1px at 160px 180px, rgba(255, 255, 255, 0.30), transparent 50%),
                radial-gradient(1.2px 1.2px at 90px 210px, rgba(150, 185, 225, 0.20), transparent 50%),
                radial-gradient(1.5px 1.5px at 70px 120px, rgba(255, 255, 255, 0.27), transparent 50%),
                radial-gradient(1.5px 1.5px at 240px 90px, rgba(205, 222, 255, 0.25), transparent 50%),
                radial-gradient(2px 2px at 130px 60px, rgba(255, 255, 255, 0.28), transparent 50%),
                radial-gradient(2px 2px at 210px 140px, rgba(190, 215, 255, 0.22), transparent 50%),
                radial-gradient(1px 1px at 80px 190px, rgba(255, 255, 255, 0.26), transparent 50%),
                radial-gradient(1.2px 1.2px at 190px 40px, rgba(150, 185, 225, 0.18), transparent 50%),
                /* Faintest magnitude: sub-pixel dust, most visible on hi-DPI screens. */
                radial-gradient(0.8px 0.8px at 47px 131px, rgba(210, 224, 248, 0.20), transparent 55%),
                radial-gradient(0.8px 0.8px at 151px 214px, rgba(196, 212, 240, 0.17), transparent 55%),
                radial-gradient(0.8px 0.8px at 268px 178px, rgba(224, 236, 255, 0.15), transparent 55%),
                radial-gradient(1px 1px at 104px 268px, rgba(214, 228, 252, 0.18), transparent 55%),
                radial-gradient(1px 1px at 236px 232px, rgba(204, 219, 246, 0.14), transparent 55%);
            background-size: 341px 259px, 311px 229px, 271px 211px, 313px 173px, 199px 191px, 131px 229px, 173px 151px, 251px 199px, 151px 131px, 229px 191px, 113px 199px, 197px 113px, 139px 167px, 167px 137px, 191px 179px, 179px 149px, 149px 127px;
            background-repeat: repeat;
        }
        /* Milky Way band: soft diagonal haze carrying unresolved star dust, broken by a
           dark dust lane (the Great Rift) where opaque clouds hide what is behind them.
           Held at texture level so it never competes with the card. */
        .stars::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(38% 7% at 58% 44%, rgba(4, 5, 12, 0.45), transparent 70%),
                radial-gradient(24% 4% at 38% 52%, rgba(4, 5, 12, 0.30), transparent 72%),
                linear-gradient(115deg, transparent 32%, rgba(176, 201, 245, 0.055) 45%, rgba(212, 229, 255, 0.040) 55%, transparent 70%),
                radial-gradient(1px 1px at 14px 22px, rgba(228, 238, 255, 0.22), transparent 60%),
                radial-gradient(1px 1px at 61px 47px, rgba(210, 224, 250, 0.18), transparent 60%),
                radial-gradient(1.2px 1.2px at 97px 71px, rgba(236, 244, 255, 0.19), transparent 60%),
                radial-gradient(1px 1px at 43px 89px, rgba(198, 214, 244, 0.15), transparent 60%),
                radial-gradient(0.8px 0.8px at 78px 13px, rgba(224, 236, 252, 0.14), transparent 60%);
            background-size: auto, auto, auto, 107px 97px, 89px 73px, 113px 83px, 71px 101px, 61px 53px;
            /* Keep the dust inside the band, thickest toward the galactic core. */
            -webkit-mask-image: linear-gradient(115deg, transparent 30%, rgba(0, 0, 0, 0.35) 42%, #000 52%, rgba(0, 0, 0, 0.45) 62%, transparent 72%);
            mask-image: linear-gradient(115deg, transparent 30%, rgba(0, 0, 0, 0.35) 42%, #000 52%, rgba(0, 0, 0, 0.45) 62%, transparent 72%);
        }
        /* Depth layers: each tier drifts at its own rate for parallax. */
        .star-layer {
            position: absolute;
            inset: 0;
            contain: layout style;
        }
        .star-layer--far  { animation: drift-far 240s linear infinite alternate; }
        .star-layer--mid {
            animation: drift-mid 170s linear infinite alternate;
        }
        .star-layer--near {
            animation: drift-near 120s linear infinite alternate;
        }
        .star {
            position: absolute;
            width: var(--s, 1.5px);
            height: var(--s, 1.5px);
            background: var(--c, #fff);
            border-radius: 50%;
            animation: twinkle-mid var(--d, 4s) infinite alternate ease-in-out;
            animation-delay: var(--dl, 0s);
        }
        .star--far  { animation-name: twinkle-far; }
        .star--mid  { animation-name: twinkle-mid; }
        .star--near {
            animation-name: twinkle-near;
            /* Glow follows the star's own tint (--c); --glow is an optional override */
            box-shadow: 0 0 var(--g, 8px) 1px var(--glow, color-mix(in srgb, var(--c, #fff) 40%, transparent));
        }
        /* Resolved disks and distant point sources do not scintillate: they hold a
           steady brightness, which is what makes them read differently from the rest. */
        .star--steady { animation: none; }
        .star--planet {
            animation: none;
            box-shadow: 0 0 6px 1px var(--glow, color-mix(in srgb, var(--c, #fff) 32%, transparent));
        }
        /* Hero stars: the sky's focal points. One quiet glow each — no diffraction
           spikes, because spikes are what tipped the sky from 'atmosphere' to 'decoration'. */
        .star--hero {
            animation-name: twinkle-hero;
            box-shadow: 0 0 var(--g, 12px) 1px var(--glow, color-mix(in srgb, var(--c, #fff) 45%, transparent));
        }
        /* Scintillation depth follows apparent size: the smallest point sources flutter
           hardest, large resolved disks breathe slowly. Amplitudes kept narrow so the
           sky shimmers rather than blinks. Uneven stops keep it from feeling like a
           metronome. */
        @keyframes twinkle-far  {
            0%, 100% { opacity: 0.12; }
            18% { opacity: 0.30; }
            31% { opacity: 0.18; }
            48% { opacity: 0.36; }
            66% { opacity: 0.20; }
            82% { opacity: 0.28; }
        }
        @keyframes twinkle-mid  {
            0%, 100% { opacity: 0.30; }
            22% { opacity: 0.52; }
            40% { opacity: 0.42; }
            58% { opacity: 0.62; }
            76% { opacity: 0.48; }
        }
        @keyframes twinkle-near {
            0%, 100% { opacity: 0.50; transform: scale(1); }
            25% { opacity: 0.72; transform: scale(1.04); }
            45% { opacity: 0.60; transform: scale(1.02); }
            62% { opacity: 0.80; transform: scale(1.06); }
            80% { opacity: 0.66; transform: scale(1.03); }
        }
        @keyframes twinkle-hero {
            0%, 100% { opacity: 0.55; transform: scale(1); }
            35% { opacity: 0.78; transform: scale(1.08); }
            50% { opacity: 0.85; transform: scale(1.10); }
            70% { opacity: 0.72; transform: scale(1.06); }
        }
        @keyframes starfield-drift {
            from { transform: translate3d(0, 0, 0); }
            to   { transform: translate3d(-2%, -1.5%, 0); }
        }
        @keyframes drift-far  { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-0.6%, -0.4%, 0); } }
        @keyframes drift-mid  { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-1.1%, -0.8%, 0); } }
        @keyframes drift-near { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-1.8%, -1.2%, 0); } }

        .shooting-stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .shooting-star {
            position: absolute;
            height: 1.5px;
            border-radius: 1.5px;
            pointer-events: none;
            will-change: transform, opacity;
            transform-origin: 100% 50%;
        }
        /* Bright head + halo at the leading tip of the tail */
        .shooting-star::before {
            content: "";
            position: absolute;
            right: -1px;
            top: 50%;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            transform: translate(50%, -50%);
            background: #fff;
            box-shadow: 0 0 5px 1px rgba(255, 255, 255, 0.45), 0 0 12px 3px var(--sglow, rgba(150, 190, 240, 0.16));
        }
        .shooting-star--fireball::before {
            width: 4px;
            height: 4px;
            box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.55), 0 0 14px 4px var(--sglow, rgba(150, 190, 240, 0.18));
        }
        /* Ionized train left behind after the head has moved on — held at 0.12 alpha so
           it reads as a memory of the path, not a second streak. */
        .meteor-train {
            position: absolute;
            height: 1.5px;
            border-radius: 1.5px;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, var(--train, rgba(170, 210, 250, 0.12)));
            animation: train-glow 4.5s ease-out forwards;
        }
        @keyframes train-glow { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
        /* Satellites: steady, non-twinkling, straight-line movers that flare briefly as they
           cross brighter air. Distinct from meteors, which streak and burn out. */
        .satellite {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: rgba(232, 242, 255, 0.70);
            box-shadow: 0 0 4px 1px rgba(232, 242, 255, 0.14);
            animation: satellite-pass var(--sd, 34s) linear forwards;
        }
        @keyframes satellite-pass {
            0%   { opacity: 0; transform: rotate(var(--rot, 0deg)) translateX(0); }
            12%  { opacity: 0.35; }
            44%  { opacity: 0.60; }
            57%  { opacity: 0.32; }
            72%  { opacity: 0.50; }
            100% { opacity: 0; transform: rotate(var(--rot, 0deg)) translateX(var(--run, 46vw)); }
        }

        /* ---------- Main card ---------- */
        .container {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 100%;
            margin: auto;
            background: var(--panel);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            /* Bottom padding slightly larger than the top: equal padding on a content
               block always reads as top-heavy. */
            padding: calc(var(--space) * 4) calc(var(--space) * 4) calc(var(--space) * 4.5);
            border: 1px solid var(--line);
            /* Two shadows: a tight contact shadow that anchors the card, and a wide
               ambient one that lifts it off the sky. */
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.30), 0 18px 40px rgba(0, 0, 0, 0.40);
            animation: fadeUp 0.5s ease-out backwards;
        }

        /* ---------- Profile ---------- */
        .profile {
            text-align: center;
        }
        .profile-frame {
            position: relative;
            width: 124px;
            height: 124px;
            margin: 0 auto calc(var(--space) * 3);
            border-radius: 50%;
            border: 1px solid var(--line-strong);
            background: #0d1521;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }
        .profile-pic {
            position: absolute;
            inset: 4px;
            width: calc(100% - 8px);
            height: calc(100% - 8px);
            border-radius: 50%;
            object-fit: cover;
            background: #0d1521;
        }

        h1 {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            line-height: var(--line-height-tight);
            text-wrap: balance;
            color: var(--text);
            margin-bottom: calc(var(--space) * 0.75);
        }
        .subtitle {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--text-dim);
        }

        /* Quiet hairline instead of a rainbow rule: structure without shouting. */
        .rule {
            height: 1px;
            width: 56px;
            background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
            margin: calc(var(--space) * 2.25) auto 0;
        }

        /* ---------- Links ---------- */
        .links {
            display: flex;
            flex-direction: column;
            gap: calc(var(--space) * 1.5);
            margin-top: calc(var(--space) * 3.5);
        }
        .link-card {
            display: grid;
            grid-template-columns: 20px 1fr 16px;
            align-items: center;
            gap: calc(var(--space) * 1.5);
            padding: calc(var(--space) * 1.625) calc(var(--space) * 2);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: var(--text);
            transition: background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
            animation: fadeUp 0.45s ease-out backwards;
        }
        .links .link-card:nth-child(1) { animation-delay: 0.06s; }
        .links .link-card:nth-child(2) { animation-delay: 0.10s; }
        .links .link-card:nth-child(3) { animation-delay: 0.14s; }
        .links .link-card:nth-child(4) { animation-delay: 0.18s; }
        .links .link-card:nth-child(5) { animation-delay: 0.22s; }

        .link-card:hover {
            transform: translateY(-1px);
            background: var(--surface-hover);
            border-color: color-mix(in srgb, var(--accent) 40%, transparent);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.28);
        }
        .link-card:focus-visible {
            outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
            outline-offset: 2px;
        }
        /* Pressed state: the lift comes back down so the row feels touched, not
           just hovered. */
        .link-card:active {
            transform: translateY(0);
            background: var(--surface-hover);
            border-color: color-mix(in srgb, var(--accent) 55%, transparent);
        }

        .link-card .icon {
            width: 20px;
            height: 20px;
            fill: var(--accent);
            transition: transform 0.18s ease;
        }
        .link-card:hover .icon {
            transform: scale(1.06);
        }
        .link-card .label {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            line-height: 1.35;
        }
        /* Trailing arrow: fills the right column so the row reads as a list, not a
           centred badge, and gives the hover state somewhere to land. */
        .link-card .arrow {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--text-faint);
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.18s ease, transform 0.18s ease;
        }
        .link-card:hover .arrow {
            stroke: var(--accent);
            transform: translateX(2px);
        }

        /* Per-platform accents — brand-faithful, used only on the icon and the hover
           border. Cards sit on a neutral line at rest so the list reads as one system. */
        .discord     { --accent: #5865F2; }
        .twitter     { --accent: #1DA1F2; }
        .bluesky     { --accent: #1185FE; }
        .telegram    { --accent: #2AABEE; }
        .kofi        { --accent: #FF6B5B; }

        /* ---------- Footer ---------- */
        footer {
            position: relative;
            z-index: 1;
            margin-top: calc(var(--space) * 2.5);
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: var(--text-faint);
            text-align: center;
        }

        /* ---------- Animations ---------- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 480px) {
            body { padding: calc(var(--space) * 2) calc(var(--space) * 1.5); }
            .container { padding: calc(var(--space) * 3) calc(var(--space) * 3) calc(var(--space) * 3.5); }
            h1 { font-size: 1.5rem; }
            .link-card { padding: calc(var(--space) * 1.5) calc(var(--space) * 1.75); }
            .profile-frame { width: 112px; height: 112px; }
        }

        /* ---------- Reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .shooting-stars { display: none; }
            /* Stars: stop drifting/twinkling, hold a steady readable brightness */
            .stars, .star, .star-layer { animation: none !important; }
            .star--far  { opacity: 0.28; }
            .star--mid  { opacity: 0.45; }
            .star--near { opacity: 0.70; }
            .star--hero { opacity: 0.80; }
            .star--steady { opacity: 0.40; }
            .star--planet { opacity: 0.65; }
        }

        /* ---------- Forced colors (Windows high contrast) ---------- */
        @media (forced-colors: active) {
            /* The sky is decoration: it keeps its own colours while the interface
               adopts the system palette. */
            .starfield, .stars, .shooting-stars { forced-color-adjust: none; }
            .container, .link-card, .profile-frame { border-color: CanvasText; }
            .link-card:focus-visible { outline-color: Highlight; }
            .link-card:hover, .link-card:active { border-color: Highlight; }
            .link-card .icon { fill: CanvasText; }
            .link-card .arrow { stroke: CanvasText; }
            .rule { background: CanvasText; }
            footer { color: CanvasText; }
        }

        /* ---------- Higher preference contrast ---------- */
        @media (prefers-contrast: more) {
            :root {
                --panel: rgba(11, 16, 24, 0.92);
                --surface: rgba(255, 255, 255, 0.05);
                --line: rgba(226, 234, 245, 0.24);
                --line-strong: rgba(226, 234, 245, 0.38);
                --text-dim: rgba(226, 234, 245, 0.80);
                --text-faint: rgba(226, 234, 245, 0.60);
            }
            /* Blur and soft shadows cost legibility here. */
            .container, .profile-frame { backdrop-filter: none; box-shadow: none; }
            /* The sky should not compete with the text. */
            .starfield, .stars { opacity: 0.45; }
            .stars::before, .stars::after { background-image: none; }
        }
    </style>
</head>
<body>

    <script>
        (function () {
            'use strict';

            // Starfield: clustered density, seeded (same sky every visit), drifting depth layers
            var starsContainer = document.getElementById('stars');
            if (starsContainer) {
                function mulberry32(seed) {
                    var a = seed >>> 0;
                    return function () {
                        a = (a + 0x6D2B79F5) | 0;
                        var t = Math.imul(a ^ (a >>> 15), 1 | a);
                        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                    };
                }

                var COUNT = Math.max(45, Math.min(85, Math.round((window.innerWidth * window.innerHeight) / 11000)));
                var rnd = mulberry32(20260817);                 // same sky on every visit
                var bell = function () { return (rnd() + rnd() + rnd() - 1.5) / 1.5; }; // ~gaussian, -1..1
                var clampPct = function (v, lo, hi) { return Math.max(lo, Math.min(hi, v)); };
                var tints = [[255, 255, 255], [255, 255, 255], [240, 246, 255], [226, 236, 252], [212, 224, 244], [200, 214, 238], [236, 232, 224]];
                // Interstellar extinction: the faintest magnitudes never reach full brightness,
                // so --c carries its own alpha and the twinkle keyframes multiply against it.
                var tint = function (a) {
                    var t = tints[(rnd() * tints.length) | 0];
                    return 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',' + a.toFixed(2) + ')';
                };
                var tiers = [
                    { name: 'far',  cut: 0.55, min: 1.0, max: 1.4, dMin: 7.0, dMax: 14.0, aMin: 0.18, aMax: 0.30 },
                    { name: 'mid',  cut: 0.90, min: 1.2, max: 2.0, dMin: 5.0, dMax: 11.0, aMin: 0.30, aMax: 0.45 },
                    { name: 'near', cut: 1.00, min: 1.8, max: 2.8, dMin: 4.0, dMax: 9.0, aMin: 0.42, aMax: 0.62 }
                ];

                // Patchy density: a few dense cores with deliberate empty sky between them.
                var nClusters = 6 + Math.floor(rnd() * 5);
                var clusters = [], totalW = 0;
                for (var c = 0; c < nClusters; c++) {
                    var w = 0.5 + rnd() * 1.5;
                    totalW += w;
                    clusters.push({
                        x: 8 + rnd() * 84, y: 5 + rnd() * 72,
                        r: 6 + rnd() * 14, w: w, hero: rnd() < 0.65
                    });
                }

                var layers = {}, frag = document.createDocumentFragment();
                for (var t = 0; t < tiers.length; t++) {
                    var layer = document.createElement('div');
                    layer.className = 'star-layer star-layer--' + tiers[t].name;
                    layers[tiers[t].name] = layer;
                    frag.appendChild(layer);
                }

                // One bright focal star at the core of selected clusters, capped at four:
                // the sky needs a few accents, not a field of them.
                var placed = 0;
                for (var h = 0; h < clusters.length && placed < 4; h++) {
                    if (!clusters[h].hero) continue;
                    var hero = document.createElement('div');
                    hero.className = 'star star--near star--hero';
                    hero.style.cssText = 'left:' + clusters[h].x.toFixed(2) + '%;' +
                        'top:' + clusters[h].y.toFixed(2) + '%;' +
                        '--s:' + (2.6 + rnd() * 1.2).toFixed(1) + 'px;--c:' + tint(0.72) + ';' +
                        '--d:' + (4 + rnd() * 4).toFixed(1) + 's;--dl:' + (rnd() * 8).toFixed(1) + 's;' +
                        '--g:' + (10 + rnd() * 6).toFixed(0) + 'px;' +
                        '--sd:' + (6 + rnd() * 5).toFixed(1) + 's;';
                    layers.near.appendChild(hero);
                    placed++;
                }

                for (var i = 0; i < COUNT - placed; i++) {
                    var r = rnd();
                    var tier = r < tiers[0].cut ? tiers[0] : (r < tiers[1].cut ? tiers[1] : tiers[2]);
                    var x, y;
                    if (rnd() < 0.62) {
                        var pick = rnd() * totalW, cl = clusters[0];
                        for (var k = 0; k < clusters.length; k++) {
                            pick -= clusters[k].w;
                            if (pick <= 0) { cl = clusters[k]; break; }
                        }
                        x = clampPct(cl.x + bell() * cl.r, 1, 99);
                        y = clampPct(cl.y + bell() * cl.r, 1, 95);
                    } else {
                        x = rnd() * 100;
                        y = 100 * Math.pow(rnd(), 1.35); // field stars lean toward the zenith
                    }
                    var size = tier.min + rnd() * (tier.max - tier.min);
                    // Scintillation depth follows apparent size: small point sources flutter
                    // faster than large resolved disks.
                    var dur = (tier.dMin + rnd() * (tier.dMax - tier.dMin)) * (1.5 - size / tier.max * 0.5);
                    // Resolved disks and distant point sources do not scintillate.
                    var steady = rnd() < (size > 2.4 ? 0.30 : 0.10);
                    var cssText = 'left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%;' +
                        '--s:' + size.toFixed(1) + 'px;--c:' + tint(tier.aMin + rnd() * (tier.aMax - tier.aMin)) + ';' +
                        '--d:' + dur.toFixed(1) + 's;--dl:' + (rnd() * 8).toFixed(1) + 's;';
                    if (tier.name === 'near') cssText += '--g:' + (5 + rnd() * 6).toFixed(0) + 'px;';
                    var star = document.createElement('div');
                    star.className = 'star star--' + tier.name + (steady ? ' star--steady' : '');
                    star.style.cssText = cssText;
                    layers[tier.name].appendChild(star);
                }

                // Planets: warm, non-twinkling disks sitting low in the sky.
                var planets = ['rgba(238, 214, 186, 0.70)', 'rgba(206, 222, 248, 0.62)'];
                for (var p = 0; p < 2; p++) {
                    var planet = document.createElement('div');
                    planet.className = 'star star--near star--planet';
                    planet.style.cssText = 'left:' + (12 + rnd() * 76).toFixed(2) + '%;top:' + (62 + rnd() * 22).toFixed(2) + '%;' +
                        '--s:' + (2.8 + rnd() * 1.2).toFixed(1) + 'px;--c:' + planets[p] + ';' +
                        '--g:' + (5 + rnd() * 3).toFixed(0) + 'px;';
                    layers.near.appendChild(planet);
                }

                starsContainer.appendChild(frag);
            }

            // Shooting stars — randomized position, angle, speed, and interval
            var starContainer = document.getElementById('shootingStars');
            if (starContainer) {
                var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                function spawnShootingStar() {
                    var el = document.createElement('div');
                    var fireball = Math.random() < 0.12;
                    el.className = 'shooting-star' + (fireball ? ' shooting-star--fireball' : '');

                    // Start position — biased toward upper portion of viewport
                    var sx = 5 + Math.random() * 85;   // 5–90 vw
                    var sy = 3 + Math.random() * 48;   // 3–51 vh

                    // Direction — mostly right-to-left or left-to-right, always downward
                    var goingRight = Math.random() > 0.3;
                    var angleDeg = 18 + Math.random() * 38; // 18–56° below horizontal
                    var angle = goingRight ? angleDeg : (180 - angleDeg);

                    // Speed & duration
                    var dur = 650 + Math.random() * 1300; // 0.65–1.95s

                    // Tail length & thickness
                    var tailLen = 55 + Math.random() * 70; // 55–125px
                    var thickness = 1.2;

                    // Travel distance (px) — enough to cross a good chunk of viewport
                    var vw = window.innerWidth;
                    var travelPx = (30 + Math.random() * 35) * (vw / 100);

                    // Brightness variation
                    var alpha = 0.45 + Math.random() * 0.20;
                    var glowColors = ['rgba(150,190,240,0.18)', 'rgba(180,210,250,0.16)', 'rgba(210,225,250,0.14)'];
                    var glow = glowColors[(Math.random() * glowColors.length) | 0];

                    el.style.cssText =
                        'top:' + sy + 'vh;' +
                        'left:' + sx + 'vw;' +
                        'width:' + tailLen + 'px;' +
                        'height:' + thickness + 'px;' +
                        'border-radius:' + thickness + 'px;' +
                        'background:linear-gradient(90deg,transparent,rgba(255,255,255,' + alpha.toFixed(2) + '));' +
                        'transform-origin:100% 50%;' +
                        '--sglow:' + glow + ';' +
                        'opacity:0;';

                    starContainer.appendChild(el);

                    // Ionized train lingers after the head has travelled on
                    var train = null;
                    if (fireball) {
                        train = document.createElement('div');
                        train.className = 'meteor-train';
                        train.style.cssText = 'top:' + sy + 'vh;left:' + sx + 'vw;width:' + tailLen + 'px;' +
                            'transform:rotate(' + angle + 'deg);transform-origin:100% 50%;--train:' + glow + ';';
                        starContainer.appendChild(train);
                        train.addEventListener('animationend', function () { train.remove(); });
                    }

                    // Animate: rotate to angle, travel along local X axis (the rotated direction)
                    var anim = el.animate([
                        { transform: 'rotate(' + angle + 'deg) translateX(0px)', opacity: 0 },
                        { opacity: alpha, offset: 0.08 },
                        { opacity: alpha * 0.55, offset: 0.75 },
                        { transform: 'rotate(' + angle + 'deg) translateX(' + travelPx + 'px)', opacity: 0 }
                    ], {
                        duration: dur,
                        easing: 'linear'
                    });

                    anim.onfinish = function () { el.remove(); };
                }

                // Satellites: slow, steady, straight-line movers — a different rhythm from meteors.
                function spawnSatellite() {
                    if (starContainer.querySelectorAll('.satellite').length >= 1) return;
                    var el = document.createElement('div');
                    el.className = 'satellite';
                    var angleDeg = 8 + Math.random() * 40;
                    var angle = Math.random() > 0.25 ? angleDeg : (180 - angleDeg);
                    var dur = 30 + Math.random() * 22;
                    el.style.cssText = 'top:' + (4 + Math.random() * 56) + 'vh;left:' + (3 + Math.random() * 66) + 'vw;' +
                        '--run:' + (35 + Math.random() * 45) + 'vw;--rot:' + angle + 'deg;--sd:' + dur.toFixed(1) + 's;';
                    starContainer.appendChild(el);
                    el.addEventListener('animationend', function () { el.remove(); });
                }

                function spawnLoop() {
                    // Pause while the tab is hidden instead of burning timers off-screen.
                    if (document.hidden) {
                        setTimeout(spawnLoop, 5000);
                        return;
                    }
                    spawnShootingStar();
                    // Occasional meteor shower: a quick follow-up pair
                    if (Math.random() < 0.12) {
                        setTimeout(function () { spawnShootingStar(); }, 400 + Math.random() * 700);
                    }
                    setTimeout(spawnLoop, 6000 + Math.random() * 12000);
                }

                function satelliteLoop() {
                    if (document.hidden) { setTimeout(satelliteLoop, 8000); return; }
                    spawnSatellite();
                    setTimeout(satelliteLoop, 24000 + Math.random() * 36000);
                }

                if (!reduceMotion) { spawnLoop(); satelliteLoop(); }
            }

            // Graceful fallback if the avatar image is missing
            var avatar = document.querySelector('.profile-pic');
            if (avatar) {
                avatar.addEventListener('error', function () {
                    avatar.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
                        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 140 140'>" +
                        "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
                        "<stop offset='0' stop-color='#2c4a66'/>" +
                        "<stop offset='1' stop-color='#6aa9d8'/>" +
                        "</linearGradient></defs>" +
                        "<rect width='140' height='140' fill='url(#g)'/>" +
                        "<text x='70' y='84' font-size='60' text-anchor='middle'>\uD83D\uDC30</text>" +
                        "</svg>"
                    );
                }, { once: true });
            }
        })();
    </script>
