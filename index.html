    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-magenta: #ff007f;
            --neon-purple: #b400ff;
            --neon-blue: #0080ff;
            --dark-bg: #0a0a1a;
            --glass-bg: rgba(10, 20, 40, 0.6);
            --text-dim: rgba(255, 255, 255, 0.72);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--dark-bg);
            color: #fff;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            position: relative;
            overflow-x: hidden;
        }

        ::selection {
            background: rgba(0, 243, 255, 0.35);
            color: #fff;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #05050f; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 243, 255, 0.25); border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0, 243, 255, 0.4); }

        /* ---------- Background layers ---------- */
        .starfield {
            position: fixed;
            inset: 0;
            z-index: -4;
            background: radial-gradient(ellipse at center, #0d1b2a 0%, #000000 100%);
            pointer-events: none;
        }

        .aurora {
            position: fixed;
            width: 60vmax;
            height: 60vmax;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.22;
            z-index: -3;
            pointer-events: none;
            animation: drift 26s ease-in-out infinite alternate;
        }
        .aurora--cyan {
            top: -22vmax;
            left: -18vmax;
            background: radial-gradient(circle, var(--neon-cyan), transparent 62%);
        }
        .aurora--magenta {
            bottom: -26vmax;
            right: -18vmax;
            background: radial-gradient(circle, var(--neon-magenta), transparent 62%);
            animation-delay: -13s;
        }
        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(5vmax, 4vmax) scale(1.12); }
        }

        .stars {
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate ease-in-out;
        }
        .star--bright {
            box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.25; }
            50%      { opacity: 1; }
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 243, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            -webkit-mask-image: radial-gradient(ellipse at center, #000 0%, transparent 78%);
            mask-image: radial-gradient(ellipse at center, #000 0%, transparent 78%);
        }

        .shooting-stars {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .shooting-star {
            position: absolute;
            height: 1.5px;
            border-radius: 1.5px;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* ---------- Main card ---------- */
        .container {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            margin: auto;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 32%), var(--glass-bg);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px 30px 34px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 243, 255, 0.18), inset 0 0 20px rgba(0, 243, 255, 0.08);
            animation: fadeUp 0.6s ease-out backwards;
        }

        /* ---------- Profile ---------- */
        .profile {
            text-align: center;
        }
        .profile-frame {
            position: relative;
            width: 152px;
            height: 152px;
            margin: 0 auto 24px;
            border-radius: 50%;
            animation: pulseGlow 3s infinite alternate ease-in-out;
        }
        .profile-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--neon-cyan), var(--neon-magenta), var(--neon-purple), var(--neon-blue), var(--neon-cyan));
            animation: spin 7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .profile-pic {
            position: absolute;
            inset: 5px;
            width: calc(100% - 10px);
            height: calc(100% - 10px);
            border-radius: 50%;
            object-fit: cover;
            background: #0d1526;
            box-shadow: inset 0 0 18px rgba(0, 243, 255, 0.25);
        }
        @keyframes pulseGlow {
            0%   { box-shadow: 0 0 20px rgba(0, 243, 255, 0.45); }
            100% { box-shadow: 0 0 42px rgba(0, 243, 255, 0.75), 0 0 64px rgba(255, 0, 127, 0.28); }
        }
        .status-indicator {
            position: absolute;
            bottom: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            background: #00ff88;
            border-radius: 50%;
            border: 3px solid var(--dark-bg);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
            70%  { box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
        }

        h1 {
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 0.04em;
            background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.35));
        }
        .subtitle {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            color: var(--text-dim);
        }

        .rainbow-line {
            height: 3px;
            width: 160px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), var(--neon-purple), var(--neon-blue));
            margin: 18px auto 0;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .rainbow-line::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
            animation: shimmer 2.4s infinite;
        }
        @keyframes shimmer {
            0%   { left: -100%; }
            100% { left: 100%; }
        }

        /* ---------- Links ---------- */
        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 28px;
        }
        .link-card {
            --accent: var(--neon-cyan);
            --accent-soft: rgba(0, 243, 255, 0.45);
            --accent-glow: rgba(0, 243, 255, 0.28);
            --accent-tint: rgba(0, 243, 255, 0.10);
            display: grid;
            grid-template-columns: 1.8rem 1fr 1.8rem;
            align-items: center;
            justify-items: center;
            gap: 14px;
            padding: 14px 22px;
            background:
                linear-gradient(135deg, var(--accent-tint), transparent 55%),
                rgba(10, 20, 40, 0.62);
            border: 1px solid var(--accent-soft);
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            position: relative;
            overflow: hidden;
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 14px var(--accent-tint), 0 0 12px var(--accent-glow);
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            animation: fadeUp 0.5s ease-out backwards;
        }
        .links .link-card:nth-child(1) { animation-delay: 0.12s; }
        .links .link-card:nth-child(2) { animation-delay: 0.20s; }
        .links .link-card:nth-child(3) { animation-delay: 0.28s; }
        .links .link-card:nth-child(4) { animation-delay: 0.36s; }
        .links .link-card:nth-child(5) { animation-delay: 0.44s; }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transition: left 0.55s ease;
        }
        .link-card:hover::before,
        .link-card:focus-visible::before {
            left: 100%;
        }
        .link-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            background:
                linear-gradient(135deg, var(--accent-glow), transparent 60%),
                rgba(14, 26, 52, 0.78);
            box-shadow: 0 10px 24px var(--accent-glow), 0 0 0 1px var(--accent-soft), inset 0 0 18px var(--accent-tint);
        }
        .link-card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .link-card .icon {
            font-size: 1.45rem;
            width: 1.8rem;
            height: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            filter: drop-shadow(0 0 6px var(--accent-glow));
            transition: transform 0.25s ease;
        }
        .link-card .icon-svg {
            width: 1.65rem;
            height: 1.65rem;
            fill: var(--accent);
        }
        .link-card:hover .icon {
            transform: scale(1.12);
        }
        .link-card .label {
            font-size: 1.12rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }
        /* Per-platform accent colors */
        /* Per-platform accents — brand-faithful, balanced cool ramp + one warm counterpoint (Ko-fi) */
        .discord     { --accent: #5865F2; --accent-soft: rgba(88, 101, 242, 0.5);  --accent-glow: rgba(88, 101, 242, 0.32); --accent-tint: rgba(88, 101, 242, 0.12); }
        .twitter     { --accent: #1DA1F2; --accent-soft: rgba(29, 161, 242, 0.5);  --accent-glow: rgba(29, 161, 242, 0.32); --accent-tint: rgba(29, 161, 242, 0.12); }
        .bluesky     { --accent: #1185FE; --accent-soft: rgba(17, 133, 254, 0.5);  --accent-glow: rgba(17, 133, 254, 0.32); --accent-tint: rgba(17, 133, 254, 0.12); }
        .telegram    { --accent: #2AABEE; --accent-soft: rgba(42, 171, 238, 0.5);  --accent-glow: rgba(42, 171, 238, 0.32); --accent-tint: rgba(42, 171, 238, 0.12); }
        .kofi        { --accent: #FF6B5B; --accent-soft: rgba(255, 107, 91, 0.5);  --accent-glow: rgba(255, 107, 91, 0.32); --accent-tint: rgba(255, 107, 91, 0.12); }

        /* ---------- Footer ---------- */
        footer {
            position: relative;
            z-index: 1;
            margin-top: 22px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
        }

        /* ---------- Animations ---------- */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 480px) {
            body { padding: 16px 12px; }
            .container { padding: 32px 20px 28px; }
            h1 { font-size: 2rem; }
            .link-card { padding: 12px 18px; }
            .link-card .label { font-size: 1.05rem; }
        }

        /* ---------- Reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .shooting-stars { display: none; }
        }
    </style>
</head>

    <script>
        (function () {
            'use strict';

            // Generate a natural-looking starfield (varied size, speed, and delay)
            var starsContainer = document.getElementById('stars');
            if (starsContainer) {
                var COUNT = 150;
                var frag = document.createDocumentFragment();
                for (var i = 0; i < COUNT; i++) {
                    var star = document.createElement('div');
                    star.className = 'star';

                    var size = (Math.random() * 2 + 1).toFixed(1);
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.left = (Math.random() * 100).toFixed(2) + '%';
                    star.style.top = (Math.random() * 100).toFixed(2) + '%';
                    star.style.animationDuration = (Math.random() * 3 + 2).toFixed(1) + 's';
                    star.style.animationDelay = (Math.random() * 4).toFixed(1) + 's';

                    // A few brighter stars with a soft glow
                    if (Math.random() < 0.08) {
                        star.className += ' star--bright';
                    }
                    frag.appendChild(star);
                }
                starsContainer.appendChild(frag);
            }

            // Shooting stars — randomized position, angle, speed, and interval
            var starContainer = document.getElementById('shootingStars');
            if (starContainer && window.requestAnimationFrame) {
                var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (!reduceMotion) {
                    (function spawnLoop() {
                        spawnShootingStar();
                        setTimeout(spawnLoop, 3000 + Math.random() * 9000);
                    })();
                }

                function spawnShootingStar() {
                    var el = document.createElement('div');
                    el.className = 'shooting-star';

                    // Start position — biased toward upper portion of viewport
                    var sx = 5 + Math.random() * 85;   // 5–90 vw
                    var sy = 3 + Math.random() * 48;   // 3–51 vh

                    // Direction — mostly right-to-left or left-to-right, always downward
                    var goingRight = Math.random() > 0.3;
                    var angleDeg = 18 + Math.random() * 38; // 18–56° below horizontal
                    var angle = goingRight ? angleDeg : (180 - angleDeg);

                    // Speed & duration
                    var dur = 650 + Math.random() * 1300; // 0.65–1.95s

                    // Tail length & thickness
                    var tailLen = 70 + Math.random() * 100; // 70–170px
                    var thickness = Math.random() > 0.6 ? 2 : 1.5;

                    // Travel distance (px) — enough to cross a good chunk of viewport
                    var vw = window.innerWidth;
                    var travelPx = (30 + Math.random() * 35) * (vw / 100);

                    // Brightness variation
                    var alpha = 0.65 + Math.random() * 0.3;

                    el.style.cssText =
                        'top:' + sy + 'vh;' +
                        'left:' + sx + 'vw;' +
                        'width:' + tailLen + 'px;' +
                        'height:' + thickness + 'px;' +
                        'border-radius:' + thickness + 'px;' +
                        'background:linear-gradient(90deg,transparent,rgba(255,255,255,' + alpha.toFixed(2) + '));' +
                        'transform-origin:100% 50%;' +
                        'opacity:0;';

                    starContainer.appendChild(el);

                    // Animate: rotate to angle, travel along local X axis (the rotated direction)
                    var anim = el.animate([
                        { transform: 'rotate(' + angle + 'deg) translateX(0px)', opacity: 0 },
                        { opacity: alpha, offset: 0.08 },
                        { opacity: alpha * 0.55, offset: 0.75 },
                        { transform: 'rotate(' + angle + 'deg) translateX(' + travelPx + 'px)', opacity: 0 }
                    ], {
                        duration: dur,
                        easing: 'linear'
                    });

                    anim.onfinish = function () { el.remove(); };
                }
            }

            // Graceful fallback if the avatar image is missing
            var avatar = document.querySelector('.profile-pic');
            if (avatar) {
                avatar.addEventListener('error', function () {
                    avatar.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
                        "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 140 140'>" +
                        "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>" +
                        "<stop offset='0' stop-color='#00f3ff'/>" +
                        "<stop offset='1' stop-color='#ff007f'/>" +
                        "</linearGradient></defs>" +
                        "<rect width='140' height='140' fill='url(#g)'/>" +
                        "<text x='70' y='84' font-size='60' text-anchor='middle'>\uD83D\uDC30</text>" +
                        "</svg>"
                    );
                }, { once: true });
            }
        })();
    </script>
</body>
</html>
